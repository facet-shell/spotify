; facet bloom ({{name}}) – generated by `facet theme`; edit templates/bloom/spicetify/… instead
; Enable: spicetify config current_theme bloom color_scheme bloom && spicetify apply
; bloom style: round panels on the surface tone, the gaps between them in the darkest tone.

[bloom]
text               = {{tones.text|bare}}
subtext            = {{tones.dim|bare}}
main               = {{tones.surface|bare}}
main-elevated      = {{tones.container|bare}}
highlight          = {{tones.high|bare}}
highlight-elevated = {{tones.highest|bare}}
sidebar            = {{tones.page|bare}}
player             = {{tones.surface|bare}}
card               = {{tones.container|bare}}
shadow             = {{tones.page|darken:50|bare}}
selected-row       = {{tones.text|bare}}
button             = {{tones.primary|bare}}
button-active      = {{tones.onPrimaryContainer|bare}}
button-disabled    = {{tones.outline|bare}}
tab-active         = {{tones.secondaryContainer|bare}}
notification       = {{tones.primaryContainer|bare}}
notification-error = {{tones.errorContainer|bare}}
misc               = {{tones.outline|bare}}
; Extra keys for user.css (Spicetify turns every key into --spice-<key>)
on-button          = {{tones.onPrimary|bare}}
pill               = {{tones.secondaryContainer|bare}}
